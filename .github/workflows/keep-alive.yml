name: Keep API warm + uptime alert

# Two jobs in one schedule:
# 1. Keep-alive — Render's free web service spins down after ~15 min of
#    inactivity; pinging every 14 minutes keeps it warm.
# 2. Uptime alert — if the API is genuinely down (3 attempts, 30s apart, all
#    fail), the workflow FAILS, and GitHub emails the repo owner about the
#    failed scheduled run. Enable in GitHub notification settings: Settings →
#    Notifications → Actions → "Send notifications for failed workflows".
#
# Set the repo secret API_HEALTH_URL to https://<your-api-domain>/api/health.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (retry 3x, fail loudly when down)
        run: |
          if [ -z "${{ secrets.API_HEALTH_URL }}" ]; then
            echo "Set repo secret API_HEALTH_URL to your /api/health URL to enable keep-alive."
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsS --max-time 30 "${{ secrets.API_HEALTH_URL }}"; then
              echo " — OK (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt failed."
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "::error::API health check failed 3 times — the site appears to be DOWN."
          exit 1
