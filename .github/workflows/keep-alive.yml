name: Keep API warm

# Render's free web service spins down after ~15 min of inactivity, causing a slow
# cold start on the next request. Ping the health endpoint every 14 minutes to keep
# it warm. Set the repo secret API_HEALTH_URL to https://<your-api-domain>/api/health.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ secrets.API_HEALTH_URL }}" ]; then
            echo "Set repo secret API_HEALTH_URL to your /api/health URL to enable keep-alive."
            exit 0
          fi
          curl -fsS --max-time 30 "${{ secrets.API_HEALTH_URL }}" && echo " — OK"
